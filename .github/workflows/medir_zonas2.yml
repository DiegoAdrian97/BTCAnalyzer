name: Medir lo descartado como zonas
# A mano desde Actions (o al cambiar el medidor): corre medir_zonas2.py (CoinMetrics, FRED, Fear & Greed y
# data.binance.vision, gratis) y deja el resultado como artefacto. No cambia nada del analisis: solo mide.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/medir_zonas2.yml", "medir_zonas2.py"]
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: datos_medicion, key: zonas2-v1 }
      - run: pip install numpy
      - run: set -o pipefail; python -u medir_zonas2.py | tee zonas2.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: medicion-zonas2, path: zonas2.txt }
