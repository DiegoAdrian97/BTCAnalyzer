name: Bajar funding BTC
on:
  push:
    branches: [medicion-monedas]
    paths: [".github/workflows/fundingbtc.yml", "medir/funding_btc.py"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: mkdir -p medir/monedas && python medir/funding_btc.py medir/monedas
      - run: |
          git config user.name "medicion-bot"; git config user.email "noreply@github.com"
          git add medir/monedas/funding_btc.json && git commit -q -m "funding BTC 2019-2026" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 10; done
