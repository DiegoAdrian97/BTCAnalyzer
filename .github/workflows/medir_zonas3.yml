name: Medir zonas de piso y techo (on-chain)
# A mano desde Actions (o al cambiar el medidor): ¿CVDD, SOPR, RHODL, costo de holders de corto plazo, % en ganancia, atencion,
# exchanges, SSR, liquidez y VIX marcan ZONAS de compra y de venta (a 1 año, en los dos tramos) y suman al puntaje de las 9 zonas?
# Solo mide, no cambia nada del analisis. Fuentes publicas sin clave (looknode, bitcoin-data.com, CoinMetrics, Wikipedia, CBOE, NY Fed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/medir_zonas3.yml", "medir_zonas3.py"]
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: set -o pipefail; python -u medir_zonas3.py | tee zonas3.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: medicion-zonas3, path: "zonas3.txt" }
