name: Medir Kronos
# Mide Kronos (modelo abierto de velas, github.com/shiyu-coder/Kronos) contra lo que ya predice la app: medir_kronos.py.
# Al cambiar el medidor corre una prueba corta; la medicion completa se lanza a mano desde Actions. No cambia nada de la app.
on:
  workflow_dispatch:
    inputs:
      modelo: { description: "mini, small o base", default: "mini" }
      cada: { description: "horas entre momentos medidos", default: "8" }
      prueba: { description: "1 = corrida corta para probar", default: "0" }
  push:
    branches: [main]
    paths: [".github/workflows/kronos.yml", "medir_kronos.py"]
jobs:
  medir:
    strategy:
      fail-fast: false
      matrix: { moneda: [BTC, SOL, XRP, ZEC] }
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos && git -C Kronos log -1 --format='Kronos %h %cd'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pandas lightgbm scikit-learn einops huggingface_hub safetensors tqdm
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: "kronos-${{ inputs.modelo || 'mini' }}" }
      - run: python datos_entrenamiento.py
      - run: |
          V=velas_1h.json; if [ "$MON" != BTC ]; then V=velas_1h_$MON.json; fi
          python -u medir_kronos.py "$V" eventos.json "$MON" --modelo "$MODELO" --cada "$CADA" --minutos 250 $PRUEBA | tee "kronos_$MON.txt"
        env:
          MON: ${{ matrix.moneda }}
          MODELO: ${{ inputs.modelo || 'mini' }}
          CADA: ${{ inputs.cada || '8' }}
          PRUEBA: ${{ (github.event_name == 'push' || inputs.prueba == '1') && '--prueba' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kronos-${{ matrix.moneda }}
          path: |
            kronos_${{ matrix.moneda }}.txt
            resultado_kronos_${{ matrix.moneda }}.json
