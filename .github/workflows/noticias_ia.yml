name: Medir noticias con IA
# A mano desde Actions (o al cambiar el medidor): ¿una IA abierta que lee los titulares (y junta la misma noticia de
# varios medios) anticipa mejor a BTC que las reglas de hoy? Solo mide y deja el resultado como artefacto.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/noticias_ia.yml", "medir_noticias_ia.py"]
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy lightgbm scikit-learn transformers sentence-transformers
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: noticias-ia-modelos }
      # los titulares ya bajados de corridas anteriores (GDELT es lento: un pedido cada 5 s)
      - uses: actions/cache@v4
        with: { path: titulares_gdelt.jsonl, key: "titulares-${{ github.run_id }}", restore-keys: titulares- }
      - run: python datos_entrenamiento.py
      - run: python -u -W ignore medir_noticias_ia.py velas_1h.json eventos.json --minutos 130 | tee noticias_ia.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noticias-ia
          path: |
            noticias_ia.txt
            resultado_noticias_ia.json
