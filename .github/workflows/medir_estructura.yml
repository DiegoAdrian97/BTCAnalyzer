name: Medir figuras, velas, divergencias, Elliott y cruce del MACD
# A mano desde Actions (o al cambiar el medidor): corre medir_estructura.py por temporalidad con velas publicas de
# data.binance.vision y deja el resultado como artefacto. No cambia nada del analisis: solo mide.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/medir_estructura.yml", "medir_estructura.py"]
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        tf: ["5m", "15m", "1h", "4h", "1d"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: set -o pipefail; python -u medir_estructura.py ${{ matrix.tf }} | tee estructura_${{ matrix.tf }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "medicion-estructura-${{ matrix.tf }}", path: "estructura_${{ matrix.tf }}.txt" }
