name: Medir candidatos nuevos (tendencia, estacionalidad, prima, funding, CME, otros mercados)
# A mano desde Actions (o al cambiar el medidor): corre medir_complementos.py con velas publicas de data.binance.vision y deja
# el resultado como artefacto. No cambia nada del analisis: solo mide.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/medir_complementos.yml", "medir_complementos.py"]
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - uses: actions/cache@v4
        with: { path: datos_medicion, key: senales-btc-v1 }
      - run: python -u medir_complementos.py --cme | tee complementos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: medicion-complementos, path: complementos.txt }
