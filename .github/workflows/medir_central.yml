name: Medir cuánto acierta el análisis (con lo que la app fue diciendo)
# Cada lunes y a mano: cruza las conclusiones guardadas por el servidor (rama historial) con lo que hizo el precio.
# No cambia nada del analisis: solo mide.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: set -o pipefail; python -u medir_central.py | tee central.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: medicion-central, path: central.txt }
