name: Python = JavaScript
# En cada push: el analisis en Python (Render) y en JavaScript (Vercel) tienen que dar lo mismo.
on:
  push:
    branches: [main]
    paths: ["*.py", "JavascriptVersion/*.js", "JavascriptVersion/api/*.js", "JavascriptVersion/*.json", "pruebas/**", ".github/workflows/paridad.yml"]
  workflow_dispatch:
jobs:
  paridad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - run: python pruebas/paridad.py
      - run: python pruebas/sesgo.py
      - run: node pruebas/widget_api.js   # /api/widget y el capital, con BingX simulado
