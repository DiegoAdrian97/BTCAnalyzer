name: Medir noticias
on:
  push:
    branches: [medicion-noticias]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bajar noticias y calendario
        run: python medir/bajar.py medir/datos
      - name: Guardar
        if: always()
        run: |
          git config user.name "medicion-bot"; git config user.email "noreply@github.com"
          git add medir/datos && git commit -m "Datos de noticias y calendario" && git push || echo "nada para guardar"
