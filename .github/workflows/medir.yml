name: Medir noticias
on:
  push:
    branches: [medicion-noticias]
permissions:
  contents: write
jobs:
  gdelt:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        serie: [btc_timelinetone, btc_timelinevol, guerra_timelinetone, guerra_timelinevol, fed_timelinetone, fed_timelinevol]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bajar ${{ matrix.serie }}
        run: python medir/bajar.py medir/datos gdelt:${{ matrix.serie }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "medicion-bot"; git config user.email "noreply@github.com"
          git add medir/datos/gdelt_${{ matrix.serie }}.csv && git commit -q -m "GDELT ${{ matrix.serie }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
