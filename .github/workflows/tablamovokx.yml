name: Tabla movimiento OKX
on:
  push:
    branches: [medicion-monedas]
    paths: [".github/workflows/tablamovokx.yml", "medir/tabla_mov_okx.py"]
permissions:
  contents: write
jobs:
  tabla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ccxt && mkdir -p medir/monedas && python medir/tabla_mov_okx.py MELIUSDT medir/monedas/mov_MELIUSDT.json
      - run: |
          git config user.name "DiegoAdrian97"; git config user.email "diegojadrian97@gmail.com"
          git add medir/monedas/mov_MELIUSDT*.json && git commit -q -m "tabla mov MELI (OKX)" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 10; done
