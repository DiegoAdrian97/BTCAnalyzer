name: Capturas del sitio
# A mano (o al cambiar el script): capturas de la app publicada en celular y escritorio, para revisar que se muestra.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/capturas_sitio.yml", "pruebas/capturas_sitio.js"]
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node pruebas/capturas_sitio.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas-sitio, path: capturas/ }
