name: Medir lead-lag de BTC a las alts y macro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/medir_extra.yml", "medir_extra.py"]
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        que: ["leadlag", "macro"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: set -o pipefail; python -u medir_extra.py ${{ matrix.que }} | tee extra_${{ matrix.que }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "medicion-extra-${{ matrix.que }}", path: "extra_${{ matrix.que }}.txt" }
