name: Analizar BTC una vez
# A mano desde Actions: corre el analisis completo una vez (como Render, sin el modo en vivo) y deja el reporte de la
# consola como artefacto. Sirve para leer el analisis desde fuera de la app.
on:
  workflow_dispatch:
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt numpy lightgbm
      # Bybit y Binance bloquean las maquinas de GitHub (EE.UU.): las velas salen de BingX, el exchange de Diego
      - run: |
          python -u -c "import analisis_btc as a; a.candle_source = lambda: a.exchange('bingx'); a.main()" | tee analisis.txt
      - run: |
          python - <<'PY'
          import json, collections
          R = json.load(open("data/analisis_btc.json"))
          R = R.get("rows", R) if isinstance(R, dict) else R
          n = collections.Counter(r.get("tabla") for r in R)
          print("TABLAS", dict(n))
          visto = collections.Counter()
          for r in R:
              t = r.get("tabla"); visto[t] += 1
              if t in ("vela", "serie", "liquidacion", "calibracion") and visto[t] > 2:
                  continue
              if n[t] > 40 and visto[t] > 12:
                  continue
              print(json.dumps({k: v for k, v in r.items() if v not in (None, "", [])}, ensure_ascii=False)[:900])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: analisis, path: analisis.txt }
