# Analista BTC en vivo en Render (plan gratis). En Render: New > Blueprint > este repositorio.
# Al crearlo pide VIVO_CLAVE: la contrasena para entrar al dashboard (minimo 8 caracteres).
services:
  - type: web
    name: btc-analyzer
    runtime: python
    plan: free
    region: frankfurt            # desde EE.UU. Binance bloquea los pedidos
    buildCommand: pip install -r requirements.txt
    startCommand: python analisis_btc.py --vivo 20 --servidor   # un analisis cada 20 s
    healthCheckPath: /salud
    autoDeploy: true             # cada push a main se publica solo
    envVars:
      - key: VIVO_CLAVE
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
